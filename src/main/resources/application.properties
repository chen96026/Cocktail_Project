server.port=8080
spring.application.name=Cocktail

# 預設用 H2 記憶體資料庫，每次啟動由 DataSeeder 從 seed-data.yaml 載入資料
# 要改連 MySQL：mvn spring-boot:run -Dspring-boot.run.profiles=mysql
spring.config.import=classpath:seed-data.yaml
spring.datasource.url=jdbc:h2:mem:cocktail
spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.show-sql=true
# LAZY 關聯（材料、基酒）改成一次用 IN 批次載入，避免列表 N+1 查詢
spring.jpa.properties.hibernate.default_batch_fetch_size=64
# 關閉 OSIV：Entity 一律在 Service 的交易內轉成 DTO，交易結束後不會再 lazy load
spring.jpa.open-in-view=false
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
